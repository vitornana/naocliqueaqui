<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcel Esquadrias de Alumínio — Login</title>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo-area">
        <img
          src="logo.png"
          alt="Marcel Esquadrias de Alumínio"
          class="logo-img"
        />
      </div>

      <div class="fields">
        <button type="button" class="btn-login" onclick="fazerLogin()">
          Entrar
        </button>
      </div>

      <footer class="card-footer">© 2026 Marcel Esquadrias de Alumínio</footer>
    </main>

    <script>
      function fazerLogin() {
        // Grava a "chave" na memória temporária do navegador
        sessionStorage.setItem("autenticado", "sim");

        // Direciona para o painel principal
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
